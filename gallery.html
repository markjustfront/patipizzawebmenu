<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pati Pizza • Customer Gallery</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: 'Inter', sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(rgba(0, 0, 0, .55), rgba(0, 0, 0, .55)),
                url("background-1.jpeg") center/cover fixed;

            color: #f5f0e8;

            padding: 25px;

        }

        .back {

            color: #fff;

            text-decoration: none;

            font-size: 1.1rem;

            transition: .25s;

        }

        .back:hover {

            opacity: .75;

        }

        .logo {

            text-align: center;

            font-family: 'Playfair Display', serif;

            font-size: clamp(2.7rem, 7vw, 4rem);

            margin: 20px 0 25px;

        }

        .header {

            max-width: 1200px;

            margin: auto;

            margin-bottom: 25px;

            padding: 30px;

            border-radius: 28px;

            background: rgba(255, 255, 255, .10);

            backdrop-filter: blur(14px);

            border: 1px solid rgba(255, 255, 255, .18);

            text-align: center;

        }

        .rating {

            font-size: 2rem;

            font-weight: 600;

        }

        #reviewCount {

            margin-top: 8px;

            opacity: .9;

        }

        .google-btn {

            display: inline-block;

            margin-top: 18px;

            background: #fff;

            color: #222;

            text-decoration: none;

            padding: 13px 24px;

            border-radius: 50px;

            font-weight: 600;

            transition: .25s;

        }

        .google-btn:hover {

            transform: translateY(-3px);

        }

        .filters {

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 12px;

            margin-top: 30px;

        }

        .filter {

            background: rgba(255, 255, 255, .95);

            color: #222;

            padding: 12px 20px;

            border-radius: 50px;

            cursor: pointer;

            transition: .25s;

            font-weight: 500;

        }

        .filter:hover {

            transform: translateY(-2px);

        }

        .filter.active {

            background: #2c2118;

            color: white;

        }

        .gallery {

            max-width: 1200px;

            margin: auto;

            display: grid;

            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));

            gap: 22px;

        }

        .card {

            overflow: hidden;

            border-radius: 22px;

            background: white;

            cursor: pointer;

            transition: .3s;

            box-shadow: 0 10px 35px rgba(0, 0, 0, .25);

        }

        .card:hover {

            transform: translateY(-6px);

        }

        .card img {

            width: 100%;

            aspect-ratio: 1/1;

            object-fit: cover;

            display: block;

        }

        .modal {

            position: fixed;

            inset: 0;

            display: none;

            justify-content: center;

            align-items: center;

            padding: 20px;

            background: rgba(0, 0, 0, .82);

            z-index: 999;

        }

        .modal-content {

            width: min(950px, 100%);

            max-height: 90vh;

            overflow: auto;

            background: white;

            color: #222;

            border-radius: 28px;

            animation: popup .25s ease;

        }

        @keyframes popup {

            from {

                transform: scale(.95);

                opacity: 0;

            }

            to {

                transform: scale(1);

                opacity: 1;

            }

        }

        .modal img {

            width: 100%;

            display: block;

        }

        .modal-body {

            padding: 30px;

        }

        .close {

            float: right;

            cursor: pointer;

            font-size: 2rem;

            font-weight: bold;

        }

        #modalTitle {

            font-family: 'Playfair Display', serif;

            font-size: 2rem;

            margin-bottom: 10px;

        }

        #modalStars {

            color: #d39b17;

            font-size: 1.15rem;

            margin-bottom: 18px;

        }

        #modalReview {

            line-height: 1.6;

            margin-bottom: 25px;

        }

        .section-title {

            margin-top: 20px;

            margin-bottom: 10px;

            font-weight: 600;

        }

        .items {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

        }

        .item {

            background: #f3f3f3;

            border-radius: 50px;

            padding: 10px 16px;

            cursor: pointer;

            transition: .2s;

        }

        .item:hover {

            background: #e6e6e6;

        }

        .infoModal {

            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, .6);

            display: none;

            justify-content: center;

            align-items: center;

            z-index: 1000;

        }

        .infoBox {

            width: min(420px, 90vw);

            background: white;

            color: #222;

            border-radius: 22px;

            padding: 25px;

            text-align: center;

        }

        .infoBox h2 {

            font-family: 'Playfair Display', serif;

            margin-bottom: 15px;

        }

        .infoBox p {

            line-height: 1.6;

            margin-bottom: 20px;

        }

        .infoPrice {

            font-size: 1.25rem;

            font-weight: bold;

            margin-bottom: 20px;

        }

        .infoClose {

            border: none;

            background: #2c2118;

            color: white;

            padding: 12px 22px;

            border-radius: 50px;

            cursor: pointer;

        }

        @media(max-width:768px) {

            body {

                padding: 15px;

            }

            .header {

                padding: 22px;

            }

            .gallery {

                grid-template-columns: 1fr;

            }

            .logo {

                font-size: 2.6rem;

            }

            .modal-body {

                padding: 22px;

            }

        }
    </style>

</head>

<body>

    <a href="index.html" class="back">← Back</a>

    <h1 class="logo">PATI PIZZA</h1>

    <div class="header">

        <div class="rating" id="rating"></div>

        <div id="reviewCount"></div>

        <a id="googleLink" class="google-btn" target="_blank">

            View on Google Reviews

        </a>

        <div class="filters">

            <div class="filter active" data-filter="all">
                All
            </div>

            <div class="filter" data-filter="pizza">
                🍕 Pizza
            </div>

            <div class="filter" data-filter="entrant">
                🍴 Entrants
            </div>

            <div class="filter" data-filter="amanida">
                🥗 Amanides
            </div>

        </div>

    </div>

    <div class="gallery" id="gallery">
    </div>

    <div class="modal" id="modal">

        <div class="modal-content">

            <img id="modalImage">

            <div class="modal-body">

                <span class="close">
                    &times;
                </span>

                <h2 id="modalTitle"></h2>

                <div id="modalStars"></div>

                <p id="modalReview"></p>

                <h3 class="section-title">

                    Seen in this photo

                </h3>

                <div class="items" id="modalItems">
                </div>

            </div>

        </div>

    </div>

    <div class="infoModal" id="infoModal">

        <div class="infoBox">

            <h2 id="infoTitle"></h2>

            <p id="infoDescription"></p>

            <div class="infoPrice" id="infoPrice">
            </div>

            <button class="infoClose" id="infoClose">

                Close

            </button>

        </div>

    </div>

    <script>

        let menuData = {};
        let reviews = [];
        let stats = {};

        const gallery = document.getElementById("gallery");
        const modal = document.getElementById("modal");
        const infoModal = document.getElementById("infoModal");

        async function init() {

            stats = await fetch("stats.json").then(r => r.json());
            menuData = await fetch("menu.json").then(r => r.json());
            reviews = await fetch("reviews.json").then(r => r.json());

            document.getElementById("rating").innerHTML =
                `⭐ ${stats.rating} / 5`;

            document.getElementById("reviewCount").innerHTML =
                `${stats.reviews} Google Reviews`;

            document.getElementById("googleLink").href =
                stats.google;

            renderReviews(reviews);

        }

        function renderReviews(list) {

            gallery.innerHTML = "";

            list.forEach(review => {

                const card = document.createElement("div");
                card.className = "card";

                card.innerHTML =
                    `<img src="${review.photo}" loading="lazy">`;

                card.onclick = () => openReview(review);

                gallery.appendChild(card);

            });

        }

        function openReview(review) {

            modal.style.display = "flex";

            document.getElementById("modalImage").src =
                review.photo;

            document.getElementById("modalStars").innerHTML =
                `⭐ ${Number(review.rating).toFixed(1)} / 5`;

            document.getElementById("modalReview").textContent =
                review.review;

            const itemsDiv =
                document.getElementById("modalItems");

            itemsDiv.innerHTML = "";

            if (review.items.length) {

                const first =
                    menuData[review.items[0]];

                document.getElementById("modalTitle").textContent =
                    first.name;

            }

            review.items.forEach(id => {

                const data = menuData[id];

                if (!data) return;

                const button =
                    document.createElement("div");

                button.className = "item";

                button.textContent = data.name;

                button.onclick = () => showItem(data);

                itemsDiv.appendChild(button);

            });

        }

        function showItem(item) {

            document.getElementById("infoTitle").textContent =
                item.name;

            document.getElementById("infoDescription").textContent =
                item.description;

            document.getElementById("infoPrice").textContent =
                item.price ? item.price : "";

            infoModal.style.display = "flex";

        }

        function closeModal() {

            modal.style.display = "none";

        }

        function closeInfo() {

            infoModal.style.display = "none";

        }

        document.querySelector(".close").onclick =
            closeModal;

        document.getElementById("infoClose").onclick =
            closeInfo;

        modal.onclick = function (e) {

            if (e.target === modal) {

                closeModal();

            }

        }

        infoModal.onclick = function (e) {

            if (e.target === infoModal) {

                closeInfo();

            }

        }

        document.addEventListener("keydown", e => {

            if (e.key === "Escape") {

                closeModal();
                closeInfo();

            }

        });

        document.querySelectorAll(".filter").forEach(button => {

            button.onclick = () => {

                document
                    .querySelectorAll(".filter")
                    .forEach(b => b.classList.remove("active"));

                button.classList.add("active");

                const category =
                    button.dataset.filter;

                if (category === "all") {

                    renderReviews(reviews);

                    return;

                }

                const filtered =
                    reviews.filter(review =>

                        review.items.some(item =>

                            menuData[item] &&
                            menuData[item].category === category

                        )

                    );

                renderReviews(filtered);

            };

        });

        init();

    </script>

</body>

</html>
