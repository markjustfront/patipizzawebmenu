<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Pati Pizza</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
                url('background-3.jpeg') center/cover no-repeat fixed;
            color: #f5f0e8;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px 15px;
        }

        .container {
            max-width: 540px;
            width: 100%;
            padding: 50px 30px;
            background: rgba(245, 240, 232, 0.13);
            backdrop-filter: blur(14px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
            text-align: center;
        }

        .back {
            position: absolute;
            top: 25px;
            left: 25px;
            color: #f5f0e8;
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: 500;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.6rem, 8vw, 3.7rem);
            margin-bottom: 12px;
        }

        .tag {
            font-size: clamp(1.1rem, 4vw, 1.3rem);
            margin-bottom: 50px;
            opacity: 0.9;
        }

        .menu-option {
            background: rgba(245, 240, 232, 0.95);
            color: #2c2118;
            border: none;
            padding: 32px 25px;
            margin: 20px 0;
            border-radius: 18px;
            font-size: clamp(1.35rem, 5vw, 1.8rem);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .menu-option:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
        }

        .copyright {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            opacity: 0.75;
            color: #f5f0e8;
            white-space: nowrap;
        }

        /* Mobile adjustments */
        @media (max-width: 480px) {
            .container {
                padding: 40px 25px;
            }
        }
    </style>
</head>

<body>
    <a href="index.html" class="back">← Back</a>

    <div class="container">
        <h1>PATI PIZZA</h1>
        <p class="tag">Peratallada • Pizza al Foc de Llenya</p>

        <div class="menu-option" onclick="openPDF('food-ca.pdf')">
            Menu
        </div>

        <div class="menu-option" onclick="openPDF('drinks-ca.pdf')">
            Begudes
        </div>

        <div class="menu-option" onclick="openPDF('deserts-ca.pdf')">
            Postres
        </div>
    </div>

    <div class="copyright">
        © 2026 Pati Pizza • markjustfront
    </div>

    <script>
        function openPDF(filename) {
            window.open(filename, '_blank');
        }
    </script>
</body>

</html>
