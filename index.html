<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pati Pizza - Peratallada</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
                        url('background.png') center/cover no-repeat fixed;
            color: #f5f0e8;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 560px;
            padding: 60px 40px;
            background: rgba(255,255,255,0.13);
            backdrop-filter: blur(14px);
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.25);
            box-shadow: 0 25px 70px rgba(0,0,0,0.45);
            text-align: center;
        }
        
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 4.3rem;
            letter-spacing: -2px;
            margin-bottom: 10px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        
        .tagline {
            font-size: 1.45rem;
            margin-bottom: 12px;
            opacity: 0.95;
        }
        
        .location {
            font-size: 1.2rem;
            margin-bottom: 55px;
            opacity: 0.9;
        }
        
        .lang-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        
        .lang-btn {
            background: rgba(255,255,255,0.95);
            color: #2c2118;
            border: none;
            padding: 28px 20px;
            font-size: 1.45rem;
            font-weight: 500;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
        }
        
        .lang-btn:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.35);
        }
        
        .maps-link {
            margin-top: 55px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.95);
            color: #2c2118;
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: 500;
            padding: 16px 36px;
            border-radius: 50px;
            transition: all 0.3s;
        }
        
        .maps-link:hover {
            background: white;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo">PATI PIZZA</h1>
        <p class="tagline">Pizza al Foc de Llenya • Terrassa Exclusiva</p>
        <p class="location">Peratallada, Catalunya</p>
        
        <p style="margin: 35px 0 30px; font-size:1.25rem;">Escull el teu idioma</p>
        
        <div class="lang-grid">
            <button class="lang-btn" onclick="goToLanguage('ca')">Català</button>
            <button class="lang-btn" onclick="goToLanguage('es')">Castellano</button>
            <button class="lang-btn" onclick="goToLanguage('en')">English</button>
            <button class="lang-btn" onclick="goToLanguage('fr')">Français</button>
        </div>

        <a href="YOUR_GOOGLE_MAPS_LINK_HERE" target="_blank" class="maps-link">
            📍 Google Maps • Reviews & Photos
        </a>
    </div>

    <script>
        function goToLanguage(lang) {
            window.location.href = `menu-${lang}.html`;
        }
    </script>
</body>
</html>
