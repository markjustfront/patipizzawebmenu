<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pati Pizza - Peratallada</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e8d9c2, #d4b89e);
            color: #3f2a1e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 540px;
            padding: 50px 30px;
            background: rgba(255,255,255,0.92);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(63, 42, 30, 0.15);
            text-align: center;
        }
        
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 3.9rem;
            color: #9c3a2b;
            margin-bottom: 8px;
        }
        
        .tagline {
            font-size: 1.35rem;
            color: #6b4e3d;
            margin-bottom: 12px;
        }
        
        .location {
            font-size: 1.15rem;
            color: #8c6b55;
            margin-bottom: 50px;
        }
        
        .lang-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }
        
        .lang-btn {
            background: #fff;
            border: 2px solid #9c3a2b;
            color: #3f2a1e;
            padding: 28px 20px;
            font-size: 1.4rem;
            font-weight: 500;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(156, 58, 43, 0.1);
        }
        
        .lang-btn:hover {
            background: #9c3a2b;
            color: white;
            transform: translateY(-4px);
        }
        
        .maps-link {
            margin-top: 50px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #3f2a1e;
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            padding: 16px 32px;
            border-radius: 50px;
            transition: all 0.3s;
        }
        
        .maps-link:hover {
            background: #9c3a2b;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo">PATI PIZZA</h1>
        <p class="tagline">🍕 Pizza al Foc de Llenya</p>
        <p class="location">Peratallada • Terrassa Exclusiva</p>
        
        <p style="margin: 30px 0 25px; font-size:1.2rem; color:#6b4e3d;">Escull el teu idioma</p>
        
        <div class="lang-grid">
            <button class="lang-btn" onclick="goToLanguage('ca')">Català</button>
            <button class="lang-btn" onclick="goToLanguage('es')">Castellano</button>
            <button class="lang-btn" onclick="goToLanguage('en')">English</button>
            <button class="lang-btn" onclick="goToLanguage('fr')">Français</button>
        </div>

        <a href="YOUR_GOOGLE_MAPS_LINK_HERE" target="_blank" class="maps-link">
            📍 Google Maps • Reviews & Photos
        </a>
    </div>

    <script>
        function goToLanguage(lang) {
            window.location.href = `menu-${lang}.html`;
        }
    </script>
</body>
</html>
