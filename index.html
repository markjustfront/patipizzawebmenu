<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pati Pizza - Peratallada</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
                        url('background-1.jpeg') center/cover no-repeat fixed;
            color: #f5f0e8;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px 15px;
        }
        
        .container {
            max-width: 560px;
            width: 100%;
            padding: 50px 30px;
            background: rgba(245, 240, 232, 0.13);
            backdrop-filter: blur(14px);
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.25);
            box-shadow: 0 25px 70px rgba(0,0,0,0.45);
            text-align: center;
        }
        
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.8rem, 8vw, 4.3rem);
            letter-spacing: -2px;
            margin-bottom: 10px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        
        .tagline {
            font-size: clamp(1.1rem, 4vw, 1.45rem);
            margin-bottom: 12px;
            opacity: 0.95;
        }
        
        .location {
            font-size: clamp(1rem, 3.5vw, 1.2rem);
            margin-bottom: 50px;
            opacity: 0.9;
        }
        
        .lang-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        
        .lang-btn {
            background: rgba(245, 240, 232, 0.95);
            color: #2c2118;
            border: none;
            padding: 24px 20px;
            font-size: clamp(1.2rem, 4.5vw, 1.45rem);
            font-weight: 500;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .lang-btn-fr {
            background: rgba(139, 139, 139, 0.95);
        }
        
        .lang-btn:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.35);
        }
        
        .maps-link {
            margin-top: 45px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(245, 240, 232, 0.95);
            color: #2c2118;
            text-decoration: none;
            font-size: clamp(1rem, 3.5vw, 1.15rem);
            font-weight: 500;
            padding: 14px 32px;
            border-radius: 50px;
            transition: all 0.3s;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }
        
        .maps-link:hover {
            background: #f5f0e8;
            transform: scale(1.05);
        }
        
        .copyright {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            opacity: 0.75;
            color: #f5f0e8;
            white-space: nowrap;
        }

        /* Mobile adjustments */
        @media (max-width: 480px) {
            .container {
                padding: 40px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo">PATI PIZZA</h1>
        <p class="tagline">Pizza al Foc de Llenya</p>
        <p class="location">Peratallada</p>
        
        <p style="margin: 30px 0 25px; font-size: clamp(1.05rem, 4vw, 1.25rem);">Escull el teu idioma</p>
        
        <div class="lang-grid">
            <button class="lang-btn" onclick="goToLanguage('ca')">Català</button>
            <button class="lang-btn" onclick="goToLanguage('es')">Castellano</button>
            <button class="lang-btn" onclick="goToLanguage('en')">English</button>
            <button class="lang-btn lang-btn-fr" onclick="goToLanguage('fr')">Français</button>
        </div>

        <a href="https://www.google.com/maps/place/PATI+PIZZA/@41.975357,3.0889395,1138m/data=!3m1!1e3!4m18!1m9!3m8!1s0x12baf986e482213d:0xafc2bbfefd449068!2sPATI+PIZZA!8m2!3d41.9765614!4d3.088918!9m1!1b1!16s%2Fg%2F11k5zmklr9!3m7!1s0x12baf986e482213d:0xafc2bbfefd449068!8m2!3d41.9765614!4d3.088918!9m1!1b1!16s%2Fg%2F11k5zmklr9?entry=ttu&g_ep=EgoyMDI2MDYyMS4wIKXMDSoASAFQAw%3D%3D" target="_blank" class="maps-link">
            📍 Google Maps • Reviews & Photos
        </a>
    </div>

    <div class="copyright">
        © 2026 Pati Pizza • markjustfront
    </div>

    <script>
        function goToLanguage(lang) {
            window.location.href = `menu-${lang}.html`;
        }
    </script>
</body>
</html>
