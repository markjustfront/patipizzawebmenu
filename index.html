<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pati Pizza - Peratallada</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: #8c2a1f;
            color: #f5e8d3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)),
                url('https://source.unsplash.com/random/1920x1080/?italian-terrace');
            /* Optional background */
            background-size: cover;
        }

        .container {
            max-width: 520px;
            padding: 40px 20px;
            background: rgba(140, 42, 31, 0.92);
            border: 12px solid #fff;
            border-image: linear-gradient(#fff, #ddd) 1;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 3.6rem;
            color: #ffdd57;
            margin-bottom: 8px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.6);
        }

        .tagline {
            font-size: 1.35rem;
            margin-bottom: 8px;
        }

        .location {
            font-size: 1.2rem;
            margin-bottom: 45px;
            opacity: 0.95;
        }

        .lang-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid #fff;
            color: white;
            padding: 26px 15px;
            font-size: 1.4rem;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .lang-btn:hover {
            background: #ffdd57;
            color: #8c2a1f;
            transform: scale(1.05);
        }

        .maps-link {
            margin-top: 45px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #ffdd57;
            text-decoration: none;
            font-size: 1.1rem;
            padding: 14px 28px;
            border: 3px solid #ffdd57;
            border-radius: 50px;
        }

        .maps-link:hover {
            background: #ffdd57;
            color: #8c2a1f;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="logo">PATI PIZZA</h1>
        <p class="tagline">🍕 Pizzeria al Terrat • Peratallada</p>
        <p class="location">Terrassa exclusiva • Foc de llenya</p>

        <p style="margin: 35px 0 25px; font-size:1.1rem;">Escull idioma / Elige idioma</p>

        <div class="lang-grid">
            <button class="lang-btn" onclick="goToLanguage('ca')">Català</button>
            <button class="lang-btn" onclick="goToLanguage('es')">Castellano</button>
            <button class="lang-btn" onclick="goToLanguage('en')">English</button>
            <button class="lang-btn" onclick="goToLanguage('fr')">Français</button>
        </div>

        <a href="https://www.google.com/maps/place/PATI+PIZZA/@41.9765614,1.9353535,291298m/data=!3m1!1e3!4m10!1m2!2m1!1spati+pizza!3m6!1s0x12baf986e482213d:0xafc2bbfefd449068!8m2!3d41.9765614!4d3.088918!15sCgpwYXRpIHBpenphWgwiCnBhdGkgcGl6emGSARBwaXp6YV9yZXN0YXVyYW504AEA!16s%2Fg%2F11k5zmklr9?entry=ttu&g_ep=EgoyMDI2MDUxMi4wIKXMDSoASAFQAw%3D%3D"
            target="_blank" class="maps-link">
            📍 Veure'ns a Google Maps • Opinions i fotos
        </a>
    </div>

    <script>
        function goToLanguage(lang) {
            window.location.href = `menu-${lang}.html`;
        }
    </script>
</body>

</html>
