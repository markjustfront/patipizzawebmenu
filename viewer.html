<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Pati Pizza</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Inter',sans-serif;

background:
linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
url(background-2.jpeg);

background-size:cover;

background-position:center;

background-attachment:fixed;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:30px;

color:white;

}

.container{

width:min(1200px,100%);

height:90vh;

background:rgba(245,240,232,.12);

backdrop-filter:blur(18px);

border-radius:28px;

border:1px solid rgba(255,255,255,.2);

overflow:hidden;

display:flex;

flex-direction:column;

box-shadow:0 25px 70px rgba(0,0,0,.45);

}

.header{

display:flex;

align-items:center;

justify-content:space-between;

padding:20px 28px;

}

.title{

font-family:'Playfair Display',serif;

font-size:2rem;

}

.back{

color:white;

text-decoration:none;

font-size:1.1rem;

}

iframe{

flex:1;

width:100%;

border:none;

background:white;

}

@media(max-width:768px){

body{

padding:12px;

}

.title{

font-size:1.5rem;

}

.container{

height:95vh;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<a id="backButton" class="back">← Back</a>

<div class="title">PATI PIZZA</div>

<div style="width:70px;"></div>

</div>

<iframe id="pdfViewer"></iframe>

</div>

<script>

const params=new URLSearchParams(window.location.search);

const file=params.get("file");

const back=params.get("back") || "index.html";

document.getElementById("backButton").href=back;

document.getElementById("pdfViewer").src=file+"#toolbar=0&navpanes=0&scrollbar=0";

</script>

</body>
</html>
