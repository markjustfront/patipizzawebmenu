<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Pati Pizza</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: #8c2a1f;
            color: #f5e8d3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 520px;
            padding: 40px 25px;
            text-align: center;
            background: rgba(140, 42, 31, 0.95);
            border: 12px solid #fff;
        }

        .back {
            position: absolute;
            top: 25px;
            left: 25px;
            color: #ffdd57;
            text-decoration: none;
            font-size: 1.15rem;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.2rem;
            color: #ffdd57;
        }

        .tag {
            font-size: 1.25rem;
            margin-bottom: 45px;
            opacity: 0.95;
        }

        .menu-option {
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid #ffdd57;
            padding: 35px 20px;
            margin: 25px 0;
            border-radius: 12px;
            font-size: 1.7rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .menu-option:hover {
            background: #ffdd57;
            color: #8c2a1f;
            transform: scale(1.03);
        }
    </style>
</head>

<body>
    <a href="index.html" class="back">← Back</a>

    <div class="container">
        <h1>Pati Pizza</h1>
        <p class="tag">Peratallada • Terrace</p>

        <div class="menu-option" onclick="openPDF('food-en.pdf')">
            🍕 Food Menu
        </div>

        <div class="menu-option" onclick="alert('Drinks menu coming soon!')">
            🥂 Drinks Menu
        </div>

        <a href="https://www.google.com/maps/place/PATI+PIZZA/@41.9765614,1.9353535,291298m/data=!3m1!1e3!4m10!1m2!2m1!1spati+pizza!3m6!1s0x12baf986e482213d:0xafc2bbfefd449068!8m2!3d41.9765614!4d3.088918!15sCgpwYXRpIHBpenphWgwiCnBhdGkgcGl6emGSARBwaXp6YV9yZXN0YXVyYW504AEA!16s%2Fg%2F11k5zmklr9?entry=ttu&g_ep=EgoyMDI2MDUxMi4wIKXMDSoASAFQAw%3D%3D"
            target="_blank" style="margin-top:40px; color:#ffdd57; text-decoration:none; font-size:1.1rem;">
            📍 Google Maps
        </a>
    </div>

    <script>
        function openPDF(filename) {
            window.open(filename, '_blank');
        }
    </script>
</body>

</html>
