<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - English</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500&display=swap');
        
        * { margin:0; padding:0; box-sizing:border-box; }
        
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #2c1a0f, #4a2f1f);
            color: #f5e8d3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 480px;
            padding: 40px 20px;
            text-align: center;
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            margin-bottom: 8px;
        }
        
        .back {
            position: absolute;
            top: 25px;
            left: 25px;
            color: #f5e8d3;
            text-decoration: none;
            font-size: 1.1rem;
        }
        
        .menu-option {
            background: rgba(245, 232, 211, 0.1);
            border: 2px solid #f5e8d3;
            padding: 35px 30px;
            margin: 25px 0;
            border-radius: 12px;
            font-size: 1.6rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .menu-option:hover {
            background: #f5e8d3;
            color: #2c1a0f;
            transform: scale(1.03);
        }
        
        .coming-soon {
            opacity: 0.6;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back">← Back</a>
    
    <div class="container">
        <h1>Our Menu</h1>
        <p style="margin-bottom:40px; opacity:0.9;">Choose a category</p>
        
        <div class="menu-option" onclick="openPDF('food-en.pdf')">
            🍽️ Food Menu
        </div>
        
        <div class="menu-option" onclick="alert('Drinks menu coming soon!')">
            🥂 Drinks Menu <span class="coming-soon">(coming soon)</span>
        </div>
    </div>

    <script>
        function openPDF(filename) {
            window.open(filename, '_blank');
        }
    </script>
</body>
</html>
