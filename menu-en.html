<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Pati Pizza</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap');
        
        * { margin:0; padding:0; box-sizing:border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e8d9c2, #d4b89e);
            color: #3f2a1e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 520px;
            padding: 50px 30px;
            background: rgba(255,255,255,0.92);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(63, 42, 30, 0.15);
            text-align: center;
        }
        
        .back {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #9c3a2b;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 500;
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.4rem;
            color: #9c3a2b;
            margin-bottom: 8px;
        }
        
        .tag {
            font-size: 1.25rem;
            color: #6b4e3d;
            margin-bottom: 50px;
        }
        
        .menu-option {
            background: white;
            border: 2px solid #9c3a2b;
            padding: 38px 25px;
            margin: 22px 0;
            border-radius: 16px;
            font-size: 1.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(156, 58, 43, 0.1);
        }
        
        .menu-option:hover {
            background: #9c3a2b;
            color: white;
            transform: translateY(-6px);
        }
    </style>
</head>
<body>
    <a href="index.html" class="back">← Back</a>
    
    <div class="container">
        <h1>Pati Pizza</h1>
        <p class="tag">Peratallada • Terrace</p>
        
        <div class="menu-option" onclick="openPDF('food-en.pdf')">
            🍕 Food Menu
        </div>
        
        <div class="menu-option" onclick="alert('Drinks menu coming soon!')">
            🥂 Drinks Menu
        </div>
    </div>

    <script>
        function openPDF(filename) {
            window.open(filename, '_blank');
        }
    </script>
</body>
</html>
